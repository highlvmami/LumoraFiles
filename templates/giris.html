<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LumoraFiles giriş</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .kart { background: #1e293b; padding: 28px; border-radius: 16px; width: min(92vw, 380px); text-align: center; }
    h1 { margin: 0 0 8px; }
    p { color: #94a3b8; margin: 0 0 16px; }
    input { width: 100%; padding: 14px; font-size: 28px; letter-spacing: 8px; text-align: center; border-radius: 10px;
            border: 2px solid #334155; background: #0f172a; color: #e2e8f0; }
    button { width: 100%; margin-top: 12px; padding: 14px; font-size: 18px; border: 0; border-radius: 10px;
             background: #6366f1; color: white; }
    .hata { color: #f87171; margin-top: 12px; }
  </style>
</head>
<body>
  <form class="kart" method="post" action="/giris">
    <h1>🔒 LumoraFiles</h1>
    <p>Bilgisayardaki pencerede yazan PIN'i gir</p>
    <input name="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" autofocus required>
    <button type="submit">Giriş</button>
    {% if hata %}<div class="hata">{{ hata }}</div>{% endif %}
  </form>
</body>
</html>
